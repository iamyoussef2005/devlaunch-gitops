apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-api
  namespace: argocd
spec:
  project: devlaunch-local
  source:
    repoURL: https://github.com/iamyoussef2005/devlaunch-gitops.git
    targetRevision: main
    path: charts/service-chart
    helm:
      releaseName: demo-api
      valueFiles:
        - ../../environments/local/demo-api-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: devlaunch-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
