{{- if .Values.serviceAccount.create }}
{{- if eq .Values.serviceAccount.name "devlaunch-app" }}
{{- fail "devlaunch-app is Terraform-owned; choose a different serviceAccount.name when create=true" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "service-chart.serviceAccountName" . }}
  labels:
    {{- include "service-chart.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
