nameOverride: ""
replicaCount: 1

image:
  repository: devlaunch-demo-api
  tag: "1.0.0"
  digest: ""
  pullPolicy: IfNotPresent

containerPort: 3000
service:
  port: 80

serviceAccount:
  create: false
  name: devlaunch-app

env: []
probes:
  readinessPath: /ready
  livenessPath: /health

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
